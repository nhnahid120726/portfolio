name: bazarmate
description: "A modern, clean and fully functional offline Flutter mobile app for managing shared grocery/bazar expenses for a group of students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^14.1.4
  
  # UI & Styling
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  
  # Local Database & Persistence
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  
  # Backup & Restore
  path_provider: ^2.1.3
  file_picker: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
